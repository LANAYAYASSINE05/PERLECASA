# Fait passer wss://perlecasa.com/app et /apps vers Reverb (127.0.0.1:8080), sans ouvrir le port 8080.
# Emplacement (inclusion cPanel, conservée lors des reconstructions) :
#   /etc/apache2/conf.d/userdata/ssl/2_4/gmsweb/perlecasa.com/reverb.conf
# Puis : /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
<IfModule proxy_wstunnel_module>
    ProxyPreserveHost On
    ProxyPass        /app  ws://127.0.0.1:8080/app
    ProxyPassReverse /app  ws://127.0.0.1:8080/app
    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps
</IfModule>
